[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hk-poor-flyer"
version = "0.1.0"
description = "PoorFlyer - Flight price tracker with daily scraping"
requires-python = ">=3.12"
dependencies = [
    "apscheduler>=3.11.2",
    "fake-useragent>=2.2.0",
    "flask>=3.1.3",
    "flask-migrate>=4.1.0",
    "flask-inertia>=0.10",
    "gunicorn>=26.0.0",
    "httpx>=0.28.1",
    "patchright>=1.59.1",
    "flask-sqlalchemy>=3.1.1",
]

[project.optional-dependencies]
dev = [
    "black>=26.3.1",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]

[tool.ruff.format]
quote-style = "single"
