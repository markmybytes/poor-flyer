[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "airline-price-scraper"
version = "0.1.0"
description = "Flight price tracker with daily scraping"
requires-python = ">=3.12"
dependencies = [
    "flask",
    "sqlalchemy",
    "httpx",
    "apscheduler",
    "gunicorn",
    "fake-useragent>=2.2.0",
    "patchright>=1.59.1",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["."]
