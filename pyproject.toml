[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hk-poor-flyer"
version = "0.1.0"
description = "PoorFlyer - Flight price tracker with daily scraping"
requires-python = ">=3.15"
dependencies = [
    "flask-apscheduler>=1.13.1",
    "flask-caching>=2.3.1",
    "flask>=3.1.3",
    "flask-migrate>=4.1.0",
    "flask-inertia>=0.10",
    "gunicorn>=26.0.0",
    "httpx>=0.28.1",
    "flask-sqlalchemy>=3.1.1",
    "flights @ git+https://github.com/punitarani/fli@881aee5ff4321e81ea2157cb44be94ce6a21dc1b",
]

[project.optional-dependencies]
dev = [
    "black>=26.3.1",
    "hypothesis>=6.0.0",
    "pytest>=9.0.3",
    "pytest-mock>=3.14.0",
    "ruff>=0.15.12",
]

[tool.pytest.ini_options]
testpaths = ["tests/backend"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]

[tool.ruff.format]
quote-style = "single"
