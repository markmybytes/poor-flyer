services:
  app:
    build: .
    container_name: poor-flyer
    ports:
      - '8000:8000'
    environment:
      TZ: UTC
      DATABASE_URL: sqlite:////app/data/db.sqlite
      SCHEDULER_SCRAPE_CRON: '0 9 * * *'
      SCHEDULER_SCRAPE_JITTER_SECONDS: 1800
      PUID: 1000
      PGID: 1000
    volumes:
      - ./data:/app/data
    restart: unless-stopped
