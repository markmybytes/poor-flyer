services:
  app:
    build: .
    container_name: poor-flyer
    ports:
      - '8000:8000'
    environment:
      TZ: UTC
      PF_DATABASE_URL: sqlite:////app/instance/db.sqlite
      PF_SCRAPE_CRON: '0 9 * * *'
      PF_SCRAPE_JITTER: 1800
      PF_LOG_FILE: /app/instance/app.log
      PF_LOG_MAX_BYTES: 10485760
      PF_LOG_LEVEL: INFO
      PUID: 1000
      PGID: 1000
    volumes:
      - ./instance:/app/instance
    restart: unless-stopped
