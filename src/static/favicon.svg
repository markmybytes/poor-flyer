<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="chart" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />

  <!-- Grid Background (Trading Vibe) -->
  <g stroke="#334155" stroke-width="2" stroke-dasharray="6 6" opacity="0.4">
    <path d="M 64 128 L 448 128 M 64 256 L 448 256 M 64 384 L 448 384 M 128 64 L 128 448 M 256 64 L 256 448 M 384 64 L 384 448" />
  </g>

  <!-- The Squeeze/Drop Chart Line -->
  <path
    d="M 80 180 L 140 180 L 190 110 L 250 170 L 290 290"
    fill="none"
    stroke="url(#chart)"
    stroke-width="24"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <!-- Falling Money/Coins (Saved cash) -->
  <g filter="url(#shadow)">
    <circle cx="210" cy="260" r="16" fill="#FBBF24" />
    <circle cx="210" cy="260" r="12" fill="#F59E0B" />
    <text x="210" y="266" font-family="sans-serif" font-size="16" font-weight="bold" fill="#78350F" text-anchor="middle">$</text>
    <circle cx="160" cy="320" r="12" fill="#FBBF24" />
    <circle cx="160" cy="320" r="8" fill="#F59E0B" />
    <text x="160" y="325" font-family="sans-serif" font-size="12" font-weight="bold" fill="#78350F" text-anchor="middle">$</text>
  </g>

  <!-- The "Poor" Paper Airplane -->
  <g filter="url(#shadow)">
    <polygon points="240,360 440,440 280,280" fill="#E2E8F0" />
    <polygon points="360,240 440,440 280,280" fill="#CBD5E1" />

    <!-- Left Wing Stitches -->
    <g stroke="#64748B" stroke-linecap="round" stroke-width="3">
      <line x1="310" y1="340" x2="350" y2="390" stroke-width="4" />
      <line x1="312" y1="349" x2="322" y2="341" />
      <line x1="322" y1="361" x2="332" y2="353" />
      <line x1="332" y1="374" x2="342" y2="366" />
      <line x1="342" y1="386" x2="352" y2="378" />
    </g>

    <!-- Right Wing Band-Aid -->
    <g transform="translate(345, 290) rotate(-45)">
      <rect x="-10" y="-18" width="20" height="36" rx="8" fill="#FCD34D" />
      <rect x="-6" y="-6" width="12" height="12" rx="3" fill="#FBBF24" />
      <circle cx="-2" cy="-2" r="1" fill="#D97706" />
      <circle cx="2" cy="-2" r="1" fill="#D97706" />
      <circle cx="-2" cy="2" r="1" fill="#D97706" />
      <circle cx="2" cy="2" r="1" fill="#D97706" />
    </g>
  </g>
</svg>
