<div id="graph" class="tab-content p-5">
    {% if daily_groups %}
    <canvas id="priceChart" height="80"></canvas>
    <script>
        const dailyData = [
            {% for group in daily_groups %}
            {
                date: "{{ group.date }}",
                fare: {{ group.lowest_fare if group.lowest_fare else 'null' }}
            },
            {% endfor %}
        ];
        const chartData = dailyData.filter(d => d.fare !== null).reverse();
        const ctx = document.getElementById('priceChart').getContext('2d');
        new Chart(ctx, {
            type: 'line',
            data: {
                labels: chartData.map(d => d.date),
                datasets: [{
                    label: '票價 (港幣)',
                    data: chartData.map(d => d.fare),
                    borderColor: '#2563eb',
                    backgroundColor: 'rgba(37, 99, 235, 0.05)',
                    tension: 0.3,
                    pointBackgroundColor: '#2563eb',
                    pointRadius: 4,
                }]
            },
            options: {
                responsive: true,
                plugins: { legend: { display: true } },
                scales: { y: { beginAtZero: false } }
            }
        });
    </script>
    <p class="text-xs text-gray-300 mt-3">每日最低價格</p>
    {% else %}
    <div class="p-12 text-center">
        <p class="text-gray-400">還沒有圖表數據。</p>
    </div>
    {% endif %}
</div>
