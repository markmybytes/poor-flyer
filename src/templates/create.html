{% extends "base.html" %}

{% block title %}追蹤航班{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto bg-white rounded-xl shadow-sm border p-8">
    <h2 class="text-3xl font-bold mb-6">追蹤航班</h2>
    <form method="POST" action="{{ url_for('api.create_entry') }}" class="space-y-6">
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">出發地</label>
                <input type="text" name="origin" maxlength="3" placeholder="e.g. HKG"
                    class="w-full px-4 py-2 border rounded-lg uppercase focus:outline-none focus:ring-2 focus:ring-blue-500"
                    required>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">目的地</label>
                <input type="text" name="destination" maxlength="3" placeholder="e.g. NRT"
                    class="w-full px-4 py-2 border rounded-lg uppercase focus:outline-none focus:ring-2 focus:ring-blue-500"
                    required>
            </div>
        </div>
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">航班日期</label>
                <input type="date" name="flight_date"
                    class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                    required>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">期限<span
                        class="text-gray-400 font-normal">(選填)</span></label>
                <input type="date" name="deadline"
                    class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                <p class="text-xs text-gray-400 mt-1">37%關鍵日期由今日至期限計算</p>
            </div>
        </div>
        <div class="flex gap-4 pt-2">
            <button type="submit" class="flex-1 bg-blue-600 text-white font-medium py-2.5 rounded-lg">開始追蹤</button>
            <a href="{{ url_for('pages.list_entries') }}"
                class="flex-1 text-center bg-gray-100 text-gray-700 font-medium py-2.5 rounded-lg">取消</a>
        </div>
    </form>
</div>
{% endblock %}
