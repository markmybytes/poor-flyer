{% extends "base.html" %}

{% block title %}Create Tracking Entry{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto bg-white rounded-lg shadow p-8">
    <h2 class="text-3xl font-bold mb-6">Create Tracking Entry</h2>

    <form method="POST" action="{{ url_for('api.create_entry') }}" class="space-y-6">
        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Label (optional)</label>
                <input type="text" name="name" class="w-full px-4 py-2 border rounded-lg">
            </div>
            <div></div>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">From</label>
                <input type="text" name="origin" maxlength="3" placeholder="e.g. HKG"
                    class="w-full px-4 py-2 border rounded-lg uppercase" required>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">To</label>
                <input type="text" name="destination" maxlength="3" placeholder="e.g. NRT"
                    class="w-full px-4 py-2 border rounded-lg uppercase" required>
            </div>
        </div>

        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Flight Date</label>
                <input type="date" name="flight_date" class="w-full px-4 py-2 border rounded-lg" required>
            </div>
            <div></div>
        </div>

        <div class="grid grid-cols-3 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Adults</label>
                <input type="number" name="adult_count" value="1" min="1" class="w-full px-4 py-2 border rounded-lg">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Children</label>
                <input type="number" name="child_count" value="0" min="0" class="w-full px-4 py-2 border rounded-lg">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Infants</label>
                <input type="number" name="infant_count" value="0" min="0" class="w-full px-4 py-2 border rounded-lg">
            </div>
        </div>

        <fieldset class="border rounded-lg p-4">
            <legend class="text-sm font-medium text-gray-700 mb-4">37% Rule Mode</legend>

            <div class="space-y-4">
                <label class="flex items-center">
                    <input type="radio" name="rule_mode" value="fixed_window" class="mr-3" checked
                        onchange="toggleRuleMode()">
                    <span>Fixed Window</span>
                </label>

                <div id="fixed_window_fields" class="ml-6 space-y-4">
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Monitor Start</label>
                            <input type="date" name="monitor_start" class="w-full px-4 py-2 border rounded-lg" required>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Monitor End</label>
                            <input type="date" name="monitor_end" class="w-full px-4 py-2 border rounded-lg" required>
                        </div>
                    </div>
                </div>

                <label class="flex items-center">
                    <input type="radio" name="rule_mode" value="per_data_points" class="mr-3"
                        onchange="toggleRuleMode()">
                    <span>Per Data Points</span>
                </label>

                <div id="per_data_points_fields" class="ml-6 space-y-4 hidden">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Expected Total Samples</label>
                        <input type="number" name="rule_sample_size" value="30" min="10"
                            class="w-full px-4 py-2 border rounded-lg">
                    </div>
                </div>
            </div>
        </fieldset>

        <div class="flex gap-4">
            <button type="submit" class="flex-1 bg-blue-600 text-white font-medium py-2 rounded-lg hover:bg-blue-700">
                Create
            </button>
            <a href="{{ url_for('pages.list_entries') }}"
                class="flex-1 text-center bg-gray-300 text-gray-800 font-medium py-2 rounded-lg hover:bg-gray-400">
                Cancel
            </a>
        </div>
    </form>
</div>

<script>
    function toggleRuleMode() {
        const mode = document.querySelector('input[name="rule_mode"]:checked').value;
        document.getElementById('fixed_window_fields').classList.toggle('hidden', mode !== 'fixed_window');
        document.getElementById('per_data_points_fields').classList.toggle('hidden', mode !== 'per_data_points');
    }
</script>
{% endblock %}
