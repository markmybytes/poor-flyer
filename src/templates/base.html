<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0" />

    <title>PoorFlyer</title>

    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}" />

    <script lang="javascript">
      // prettier-ignore
      {{ inertia.include_router() }}
    </script>

    <script>
      ;(() => {
        const storedTheme = window.localStorage.getItem('tracker-theme')
        const theme =
          storedTheme ||
          (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'tracker-night' : 'tracker')
        document.documentElement.setAttribute('data-theme', theme)
      })()
    </script>

    {% if vite_dev_url %}
    <script type="module" src="{{ vite_dev_url }}/@vite/client"></script>
    {% else %}
    <link rel="stylesheet" href="{{ url_for('static', filename='dist/app.css') }}" />
    {% endif %}
  </head>
  <body>
    <!-- prettier-ignore -->
    <div id="app" data-page='{{ page | tojson }}'></div>

    {% if vite_dev_url %}
    <script type="module" src="{{ vite_dev_url }}/src/frontend/main.ts"></script>
    {% else %}
    <script type="module" src="{{ url_for('static', filename='dist/app.js') }}" defer></script>
    {% endif %}
  </body>
</html>
